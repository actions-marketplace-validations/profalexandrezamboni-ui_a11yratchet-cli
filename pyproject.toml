[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "a11yratchet-cli"
version = "1.2.0"
description = "A11yRatchet WCAG 2.2 AA & EN 301 549 Ratchet Gate — Deterministic zero-LLM CI/CD, pre-commit & SARIF v2.1.0 gate"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.urls]
Homepage = "https://specgate.profalexandrezamboni.workers.dev/integrations/github-code-scanning-sarif-ci-gate"
Repository = "https://github.com/profalexandrezamboni-ui/a11yratchet-cli"

[project.scripts]
a11yratchet-cli = "a11yratchet_cli:main"

[tool.setuptools]
py-modules = ["a11yratchet_cli"]
